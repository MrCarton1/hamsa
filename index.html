<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://cvepsuziphhcvpctwako.supabase.co wss://cvepsuziphhcvpctwako.supabase.co; img-src 'self' blob: data: https://cvepsuziphhcvpctwako.supabase.co; media-src 'self' blob: https://cvepsuziphhcvpctwako.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#1A1D42">
<meta name="referrer" content="no-referrer">
<title>همسة · Hamsa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="همسة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=341">
</head>
<body>
<!-- first time: choose a language (shown in English) -->
<section id="lang" class="langpick" hidden>
  <img src="icon.svg" alt="" class="logo">
  <h1>Hamsa · همسة</h1>
  <p class="muted">Choose your language</p>
  <div class="langs">
    <button data-lang="ar"><b>العربية</b><small>Arabic</small></button>
    <button data-lang="en"><b>English</b><small>English</small></button>
    <button data-lang="nl"><b>Nederlands</b><small>Dutch</small></button>
  </div>
</section>

<!-- sign in / sign up -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <img src="icon.svg" alt="" class="logo">
    <h1>همسة</h1>
    <p class="muted" data-t="tagline"></p>
    <div class="tabs"><button class="on" data-mode="in" data-t="signIn"></button><button data-mode="up" data-t="signUp"></button></div>
    <form id="authForm" autocomplete="on">
      <label class="up"><span data-t="yourName"></span><input id="fName" maxlength="40" autocomplete="name"></label>
      <label><span data-t="username"></span><input id="fUser" dir="ltr" maxlength="20" autocomplete="username" placeholder="ahmed_01" required></label>
      <label><span data-t="password"></span><input id="fPass" type="password" dir="ltr" autocomplete="current-password" required></label>
      <button class="btn primary" id="authBtn"></button>
      <p id="authMsg" class="err"></p>
    </form>
  </div>
</section>

<!-- the app -->
<main id="app" class="app" hidden>
  <aside id="side" class="side">
    <header class="bar">
      <h1 class="wordmark">همسة</h1>
      <div class="icons">
        <button id="installBtn" data-ic="install" data-ttl="installApp" hidden></button>
        <button id="peopleBtn" class="plus" data-ic="userPlus" data-ttl="addFriends"><span id="reqCount" class="dot-pill" hidden></span></button>
        <button id="settingsBtn" class="me" data-ttl="settings"><span id="meAvatar" class="av"></span></button>
      </div>
    </header>
    <div id="pushBar" class="pushbar" hidden><span data-t="pushBar"></span><button id="pushYes" class="btn small primary" data-t="turnOn"></button><button id="pushNo" class="btn small ghost" data-t="later"></button></div>
    <div id="stories" class="stories"></div>
    <div id="chatsView">
      <input id="search" class="search" data-tph="search">
      <ul id="chatList" class="list"></ul>
    </div>
    <span id="unreadAll" hidden></span>
  </aside>

  <section id="chat" class="chat">
    <div id="empty" class="empty"><img src="icon.svg" alt=""><h2>همسة</h2><p data-t="noChats"></p></div>
    <div id="room" hidden>
      <header class="bar">
        <button id="backBtn" class="back" data-ic="back" data-ttl="back"></button>
        <span id="roomAv" class="av"></span>
        <div class="title" id="roomTitle"><b id="roomName"></b><small id="roomSub"></small></div>
        <div class="icons"><button id="videoBtn" data-ic="video" data-ttl="videoCall"></button><button id="voiceBtn" data-ic="phone" data-ttl="voiceCall"></button><button id="infoBtn" data-ic="info" data-ttl="members"></button></div>
      </header>
      <div id="msgs" class="msgs"></div>
      <div id="replyBox" class="replybox" hidden><div><b data-t="replyTo"></b> <span id="replyText"></span></div><button id="replyX">✕</button></div>
      <div id="stkPanel" class="stkpanel" hidden>
        <div class="stk-head"><b data-t="stickers"></b><button type="button" id="stkEdit" class="btn small ghost" data-t="editStickers"></button></div>
        <div id="stkGrid" class="stk-grid"></div>
      </div>
      <form id="composer" class="composer">
        <button type="button" id="stkBtn" data-ic="smile" data-ttl="stickers"></button>
        <textarea id="text" rows="1" data-tph="typeMsg" maxlength="4000"></textarea>
        <button type="button" id="attachBtn" data-ic="attach" data-ttl="photo"></button>
        <input type="file" id="fileIn" accept="image/*" hidden>
        <div id="recBar" class="recbar" hidden>
          <span class="rdot"></span><span id="recTime">0:00</span>
          <span id="recHint" class="slide"><span class="chev-s"></span><span data-t="slideCancel"></span></span>
          <button type="button" id="recDel" class="rdel" data-ic="trash" hidden></button>
        </div>
        <div id="recLock" class="reclock" hidden><span data-ic="lock"></span><span class="up"></span></div>
        <button type="button" id="micBtn" class="mic" data-ic="mic" data-ttl="holdToRecord"></button>
        <button id="sendBtn" class="send" data-ic="send" hidden></button>
      </form>
    </div>
  </section>
</main>

<!-- settings: its own screen with pages -->
<section id="settings" class="settings" hidden>
  <header class="st-bar"><button id="stBack" class="back show" data-ic="back" data-ttl="back"></button><b id="stTitle"></b></header>
  <div id="stBody" class="st-body"></div>
</section>

<!-- a call: full screen -->
<section id="call" class="call" hidden>
  <video id="callRemote" playsinline autoplay></video>
  <div class="call-top"><span id="callAv" class="av"></span><b id="callName"></b><small id="callState"></small><span class="call-e2e"><span data-ic="lock"></span><span data-t="callEncrypted"></span></span></div>
  <video id="callLocal" playsinline autoplay muted hidden></video>
  <div id="callIn" class="call-btns" hidden>
    <button id="callNo" class="cb red" data-ttl="declineCall"><span data-ic="phone"></span><small data-t="declineCall"></small></button>
    <button id="callYes" class="cb green" data-ttl="answer"><span data-ic="phone"></span><small data-t="answer"></small></button>
  </div>
  <div id="callCtl" class="call-btns" hidden>
    <button id="callMute" class="cb" data-ttl="mute"><span data-ic="micOff"></span><small data-t="mute"></small></button>
    <button id="callCam" class="cb" data-ttl="camera"><span data-ic="camOff"></span><small data-t="camera"></small></button>
    <button id="callFlip" class="cb" data-ttl="flip"><span data-ic="flip"></span><small data-t="flip"></small></button>
    <button id="callEnd" class="cb red" data-ttl="hangUp"><span data-ic="phone"></span><small data-t="hangUp"></small></button>
  </div>
</section>

<!-- statuses: full screen viewer -->
<section id="story" class="story-view" hidden>
  <div id="svBars" class="sv-bars"></div>
  <div class="sv-head"><span id="svAv" class="av sm"></span><div class="sv-who"><b id="svName"></b><small id="svTime"></small></div><button id="svMute" class="sv-btn" hidden></button><button id="svAdd" class="sv-btn" data-ic="plus" data-ttl="addStatus" hidden></button><button id="svClose" class="sv-btn" data-ic="x" data-ttl="close"></button></div>
  <div id="svBody" class="sv-body"></div>
  <div id="svFoot" class="sv-foot"></div>
</section>

<!-- kept only so an older app.js still on a phone keeps working until it updates itself -->
<div hidden aria-hidden="true"><button id="newGroupBtn" type="button"></button><div id="friendsView"><form id="addFriend"><input id="addUser"></form><p id="addMsg"></p><div id="friendsBox"></div></div></div>

<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" class="toast" hidden></div>
<div id="updBar" class="updbar" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script src="config.js?v=341"></script>
<script src="i18n.js?v=341"></script>
<script src="crypto.js?v=341"></script>
<script src="app.js?v=341"></script>
<script src="calls.js?v=341"></script>
<script src="stories.js?v=341"></script>
</body>
</html>
